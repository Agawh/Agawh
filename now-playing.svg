<svg xmlns="http://www.w3.org/2000/svg" width="340" height="68" viewBox="0 0 340 68" fill="none">
  <rect width="340" height="68" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  
  <!-- Stylized Vinyl Disk / Mini Album Art -->
  <g transform="translate(14, 12)">
    <rect width="44" height="44" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <circle cx="22" cy="22" r="14" fill="#09090b"/>
    <circle cx="22" cy="22" r="10" stroke="#27272a" stroke-width="0.8" fill="none"/>
    <circle cx="22" cy="22" r="6" fill="#18181b"/>
    <circle cx="22" cy="22" r="2" fill="#fafafa"/>
  </g>
  
  <!-- Track & Artist Info -->
  <text x="68" y="24" fill="#fafafa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Life is Beautiful</text>
  <text x="68" y="38" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Lil Peep</text>
  
  <!-- Sleek Timeline / Progress Bar -->
  <rect x="68" y="48" width="175" height="3" rx="1.5" fill="#27272a"/>
  <rect x="68" y="48" width="110" height="3" rx="1.5" fill="#1DB954"/>
  <circle cx="178" cy="49.5" r="3" fill="#fafafa"/>
  
  <text x="250" y="52" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">2:14</text>
  
  <!-- Animated Equalizer Audio Bars -->
  <g transform="translate(296, 23)">
    <rect x="0" y="4" width="3" height="14" rx="1.5" fill="#1DB954">
      <animate attributeName="height" values="6;20;10;22;8;6" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="16;2;12;0;14;16" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="6" y="8" width="3" height="10" rx="1.5" fill="#1DB954">
      <animate attributeName="height" values="16;6;20;10;18;16" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="6;16;2;12;4;6" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="2" width="3" height="16" rx="1.5" fill="#1DB954">
      <animate attributeName="height" values="10;22;6;18;12;10" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="12;0;16;4;10;12" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="18" y="6" width="3" height="12" rx="1.5" fill="#1DB954">
      <animate attributeName="height" values="20;8;16;4;22;20" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="2;14;6;18;0;2" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
